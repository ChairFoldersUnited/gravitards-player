<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080c10">
  <meta name="description" content="Gravitards Music Archive">
  <title>Gravitards Music Archive</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-shade"></div>
    <h1>Gravitards</h1>
  </header>

  <nav class="archive-bar">
    <div class="archive-bar__inner">
      <div class="archive-name">
        <span aria-hidden="true">♫</span>
        <span>GRAVITARDS MUSIC ARCHIVE</span>
      </div>

      <div class="archive-actions">
        <span id="folderPath" class="folder-path">▱ /Musik/Gravitards</span>
        <button id="refreshButton" class="refresh-button" type="button">
          <span aria-hidden="true">↻</span>
          Uppdatera
        </button>
      </div>
    </div>
  </nav>

  <main class="layout">
    <section class="library-card">
      <header class="library-header">
        <div class="library-title">
          <h2>Bibliotek</h2>
          <span id="trackCount" class="count-pill">0 låtar</span>
        </div>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Sök låt eller mapp…" autocomplete="off">
        </label>
      </header>

      <div class="table-heading" aria-hidden="true">
        <span>♫</span>
        <span>LÅT</span>
        <span>STORLEK</span>
      </div>

      <section id="message" class="message hidden" role="status"></section>
      <section id="trackList" class="track-list" aria-label="Låtar"></section>

      <footer class="library-footer">
        <span id="librarySummary">0 låtar</span>
      </footer>
    </section>

    <aside class="sidebar">
      <section class="now-card">
        <header class="card-heading">
          <h2>Spelas nu</h2>
          <span class="equalizer" aria-hidden="true">▮▮▮</span>
        </header>

        <div class="cover">
          <div class="cover-pattern"></div>
          <span aria-hidden="true">♫</span>
        </div>

        <div class="now-copy">
          <strong id="nowTitle">Välj ett spår</strong>
          <span id="nowFolder">Inget spelas</span>
        </div>

        <div class="timeline">
          <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Spola">
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="transport">
          <button id="shuffleButton" class="round-button small" type="button" title="Blanda">⤨</button>
          <button id="prevButton" class="round-button" type="button" title="Föregående">⏮</button>
          <button id="playButton" class="main-play" type="button" title="Spela eller pausa">▶</button>
          <button id="nextButton" class="round-button" type="button" title="Nästa">⏭</button>
          <button id="repeatButton" class="round-button small" type="button" title="Upprepa">↻</button>
        </div>

        <div class="volume-row">
          <span aria-hidden="true">◀</span>
          <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volym">
          <span aria-hidden="true">▶</span>
        </div>
      </section>

      <section class="info-card">
        <h2><span aria-hidden="true">▱</span> Information</h2>
        <p>Musiken hämtas direkt från Dropbox.</p>
        <p>Klicka på en låt för att spela.</p>
      </section>
    </aside>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js" defer></script>
</body>
</html>
