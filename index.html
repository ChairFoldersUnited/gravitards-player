<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Mitt musikarkiv</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DROPBOX MUSIC</p>
      <h1>Mitt musikarkiv</h1>
      <p id="libraryInfo" class="muted">Laddar biblioteket…</p>
    </div>
    <button id="refreshButton" class="ghost" type="button" title="Läs in mappen på nytt">↻ Uppdatera</button>
  </header>

  <main>
    <section class="controls" aria-label="Biblioteksverktyg">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Sök efter låt eller mapp…" autocomplete="off">
      </label>
      <button id="shuffleAllButton" class="primary" type="button">Blanda alla</button>
    </section>

    <section id="message" class="message hidden" role="status"></section>
    <section id="trackList" class="track-list" aria-label="Låtar"></section>
  </main>

  <footer class="player">
    <div class="now-playing">
      <div class="art" aria-hidden="true">♫</div>
      <div class="track-meta">
        <strong id="nowTitle">Välj ett spår</strong>
        <span id="nowFolder">Inget spelas</span>
      </div>
    </div>

    <div class="transport">
      <div class="buttons">
        <button id="shuffleButton" class="icon-button" type="button" title="Blanda">⤨</button>
        <button id="prevButton" class="icon-button" type="button" title="Föregående">⏮</button>
        <button id="playButton" class="play-button" type="button" title="Spela eller pausa">▶</button>
        <button id="nextButton" class="icon-button" type="button" title="Nästa">⏭</button>
        <button id="repeatButton" class="icon-button" type="button" title="Upprepa">↻</button>
      </div>
      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Spolning">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume">
      <span aria-hidden="true">🔊</span>
      <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volym">
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js" defer></script>
</body>
</html>
